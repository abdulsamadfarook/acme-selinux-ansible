---
# RHDP inventory (AAP 2.5 + rhel-1 / rhel-2). Two nodes instead of the lab's four:
#   rhel-1 = web tier
#   rhel-2 = app + db tier
# Why app and db share rhel-2 (not web and app): port 8282 would need TWO types on one
# host - http_port_t (httpd connects to it) and acme_api_port_t (acme-api binds it).
# App and db agree on every type (5433 = postgresql_port_t), so they can share a host.
#
# AAP connects to the nodes by name; the tiers talk to each other over the VM network,
# so each host also gets acme_ip (see group_vars/all/main.yml).
all:
  children:
    selinux_managed:
      children:
        db:
          hosts:
            rhel-2: {acme_ip: 192.168.1.13}
        app:
          hosts:
            rhel-2: {}
        web:
          hosts:
            rhel-1: {acme_ip: 192.168.1.12}
    # No SELinux-disabled host in RHDP; the group exists so playbooks that name it do not warn
    legacy:
      hosts: {}
