---
# Local lab inventory (libvirt). IPs are pinned with DHCP reservations on the "default" network.
# RHDP / AAP uses inventory_rhdp/ instead.
all:
  vars:
    ansible_user: abdul   # the lab's SSH user; in AAP the machine credential sets it
  children:
    # Everything the SELinux programme manages. Inventory order = rollout order
    # (data tier first, so each upstream tier is enforcing on a proven dependency).
    selinux_managed:
      children:
        db:
          hosts:
            db01: {ansible_host: 192.168.122.13}
        app:
          hosts:
            app01: {ansible_host: 192.168.122.12}
        web:
          hosts:
            web01: {ansible_host: 192.168.122.11}
    # Host that starts life with SELINUX=disabled (kernel boot / relabel drill)
    legacy:
      hosts:
        legacy01: {ansible_host: 192.168.122.14}
