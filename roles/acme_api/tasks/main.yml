---
# acme-api deployment. No SELinux tasks here on purpose (see README).
- name: Install runtime dependencies
  ansible.builtin.dnf:
    name: [python3, python3-psycopg2]
    state: present

- name: Create service account
  ansible.builtin.user:
    name: acme
    system: true
    shell: /sbin/nologin
    create_home: false

- name: Create application directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.owner | default('root') }}"
    mode: "{{ item.mode | default('0755') }}"
  loop:
    - {path: /opt/acme/api}
    - {path: /etc/acme, owner: acme, mode: "0750"}
    - {path: "{{ acme_api_log_dir }}", owner: acme, mode: "0750"}

- name: Install the service code
  ansible.builtin.copy:
    src: acme-api
    dest: /opt/acme/api/acme-api
    mode: "0755"
  notify: Restart acme-api

- name: Install config
  ansible.builtin.template:
    src: api.json.j2
    dest: /etc/acme/api.json
    owner: acme
    group: acme
    mode: "0640"
  notify: Restart acme-api

- name: Install unit file
  ansible.builtin.template:
    src: acme-api.service.j2
    dest: /etc/systemd/system/acme-api.service
    mode: "0644"
  notify: Restart acme-api

- name: Open the API port
  ansible.posix.firewalld:
    port: "{{ acme_api_port }}/tcp"
    permanent: true
    immediate: true
    state: enabled
  when: acme_manage_firewall | bool

- name: Start acme-api
  ansible.builtin.systemd_service:
    name: acme-api
    state: started
    enabled: true
    daemon_reload: true
